# The host-trusted mode: https://cortex.local and https://<agent>.cortex.local with no port and no certificate
# warning. It needs the host set up once (admin): a DNS route to the hub and its CA in the system store, which
# install.ps1 / install.sh (installers/setup_host.sh) do. Add it with COMPOSE_FILE=compose.yaml:compose.trusted.yaml
# in .env (Windows: COMPOSE_PATH_SEPARATOR=; and compose.yaml;compose.trusted.yaml), with CORTEX_PORT=443 and
# CORTEX_DOMAIN=cortex.local. Without it, compose.yaml alone needs nothing on the host.
services:
  hub:
    ports:
      - "${CORTEX_ADDRESS:-127.0.0.1}:${CORTEX_HTTP_PORT:-80}:8080"   # plain HTTP, only to send browsers to HTTPS
      - "${CORTEX_DNS_ADDRESS:-127.0.0.153}:53:5353/udp"   # DNS for the domain alone; the system routes it here
    command:
      - --address=${CORTEX_ADDRESS:-127.0.0.1}
      - --domain=${CORTEX_DOMAIN:-cortex.local}
      - --host-root=${CORTEX_VAULTS:-${HOME:-${USERPROFILE}}/Vaults}
      - --mcp   # agents at /mcp/<vault>, each behind the token in <vault>/_brain/state/mcp.token
      - --public-port=${CORTEX_PORT:-443}
      - --redirect-port=8080
      - --dns-port=5353
      - --lan-port=9443
      - --lan-redirect-port=9080
      - --lan-dns-port=5354
