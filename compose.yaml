# Cortex hub. Everything it needs is set here: `docker compose up -d --build` runs it as it is, with no .env, at
# http://cortex.localhost:8790 and the vaults in ~/Vaults. A .env (copy .env.example) only changes what you want to:
# the port, where the vaults live, the git identity commits are signed with (set it, or agents cannot commit what they
# learn), and on Linux your user ids. On every `up` the "vaults" service gets the vaults place ready first.
# One place holds every agent's cortex and the hub's own data (.cortex-hub: local CA, access key).
name: cortex

services:
  # every test suite inside the image, nothing on the host: docker compose run --rm test
  test:
    profiles: [tools]
    build: .
    image: cortex-hub:2.26.0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:   # the suites commit to throwaway vaults; HOME is a tmpfs with no git identity
      GIT_AUTHOR_NAME: cortex-test
      GIT_AUTHOR_EMAIL: test@cortex.local
      GIT_COMMITTER_NAME: cortex-test
      GIT_COMMITTER_EMAIL: test@cortex.local
    entrypoint: ["python3", "/opt/cortex/scripts/run_tests.py"]

  # what one engine call costs, new process against resident engine, on a throwaway 1,000-node vault:
  # docker compose run --rm bench   (add -n 50 for more calls)
  bench:
    profiles: [tools]
    build: .
    image: cortex-hub:2.26.0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python3", "/opt/cortex/scripts/bench_calls.py", "--dir", "/tmp/bench"]

  # runs once before the hub on every `up` and exits (scripts/vaults_init.sh): makes the vaults place the hub's user's,
  # and when CORTEX_VAULTS points somewhere new and empty, copies the vaults over from CORTEX_VAULTS_FROM
  vaults:
    build: .
    image: cortex-hub:2.26.0
    user: "0:0"   # root, with only the rights to copy and hand over files
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    environment:
      CORTEX_UID: ${CORTEX_UID:-1000}
      CORTEX_GID: ${CORTEX_GID:-1000}
    volumes:
      - ${CORTEX_VAULTS:-${HOME:-${USERPROFILE}}/Vaults}:/vaults
      - ${CORTEX_VAULTS_FROM:-cortex-vaults}:/from:ro
    entrypoint: ["sh", "/opt/cortex/scripts/vaults_init.sh"]

  # the command line, in the container: ./cortex.sh <command> (Windows: .\cortex.ps1), see scripts/cortex_cli.py
  cli:
    profiles: [tools]
    build: .
    image: cortex-hub:2.26.0
    depends_on:
      vaults: {condition: service_completed_successfully}
    user: "${CORTEX_UID:-1000}:${CORTEX_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # the host's model server, on Linux too
    environment:
      CORTEX_OWNER: ${CORTEX_OWNER:-the owner}
      CORTEX_GIT_NAME: ${CORTEX_GIT_NAME:-}
      CORTEX_GIT_EMAIL: ${CORTEX_GIT_EMAIL:-}
      # the owner's identity as git config too (HOME is an empty tmpfs: no ~/.gitconfig), so doctor sees it and any
      # commit made in here has an author; the hub's own commits still set GIT_AUTHOR_* (Cortex hub), which wins
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: user.name
      GIT_CONFIG_VALUE_0: ${CORTEX_GIT_NAME:-}
      GIT_CONFIG_KEY_1: user.email
      GIT_CONFIG_VALUE_1: ${CORTEX_GIT_EMAIL:-}
      CORTEX_STRATA: ${CORTEX_STRATA:-http://host.docker.internal:8080}   # the local model server REM dreaming asks (Settings)
      CORTEX_STRATA_KEY: ${CORTEX_STRATA_KEY:-/vaults/.cortex-hub/strata.key}   # its API key, if it wants one: put it in that file
    volumes:
      - ${CORTEX_VAULTS:-${HOME:-${USERPROFILE}}/Vaults}:/vaults
      - ${CORTEX_CLAUDE_PROJECTS:-${HOME:-${USERPROFILE}}/.claude/projects}:/claude-projects:ro   # memory to import
    entrypoint: ["python3", "/opt/cortex/scripts/cortex_cli.py"]

  hub:
    build: .
    image: cortex-hub:2.26.0
    depends_on:
      vaults: {condition: service_completed_successfully}
    restart: unless-stopped
    user: "${CORTEX_UID:-1000}:${CORTEX_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    extra_hosts: ["host.docker.internal:host-gateway"]   # the host's model server, on Linux too
    environment:
      CORTEX_OWNER: ${CORTEX_OWNER:-the owner}
      CORTEX_GIT_NAME: ${CORTEX_GIT_NAME:-}
      CORTEX_GIT_EMAIL: ${CORTEX_GIT_EMAIL:-}
      # the owner's identity as git config too (HOME is an empty tmpfs: no ~/.gitconfig), so doctor sees it and any
      # commit made in here has an author; the hub's own commits still set GIT_AUTHOR_* (Cortex hub), which wins
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: user.name
      GIT_CONFIG_VALUE_0: ${CORTEX_GIT_NAME:-}
      GIT_CONFIG_KEY_1: user.email
      GIT_CONFIG_VALUE_1: ${CORTEX_GIT_EMAIL:-}
      CORTEX_STRATA: ${CORTEX_STRATA:-http://host.docker.internal:8080}   # the local model server REM dreaming asks (Settings)
      CORTEX_STRATA_KEY: ${CORTEX_STRATA_KEY:-/vaults/.cortex-hub/strata.key}   # its API key, if it wants one: put it in that file
      CORTEX_LAN_ADDRESS: ${CORTEX_LAN_ADDRESS:-}   # the LAN listener; compose.lan.yaml publishes it
      CORTEX_LAN_HOST: ${CORTEX_LAN_HOST:-}
      CORTEX_LAN_DOMAIN: ${CORTEX_LAN_DOMAIN:-cortex.home}
      CORTEX_UPDATE_CHECK: ${CORTEX_UPDATE_CHECK:-1}   # once a day, is a newer Cortex published? said on brief (0: never ask)
      CORTEX_UPDATE_HOURS: ${CORTEX_UPDATE_HOURS:-24}
      CORTEX_UPDATE_REPO: ${CORTEX_UPDATE_REPO:-MadLeak/cortex-engine}
      # behind a reverse proxy: its address or network (comma list), so the bad-token limit counts the client named in
      # X-Forwarded-For, not the proxy (docs/RUNBOOK.md, Static tokens)
      CORTEX_TRUSTED_PROXIES: ${CORTEX_TRUSTED_PROXIES:-}
      # a URL the hub POSTs each security alert to, as JSON (it is also a line in .cortex-hub/alerts.jsonl)
      CORTEX_ALERT_WEBHOOK: ${CORTEX_ALERT_WEBHOOK:-}
    volumes:
      - ${CORTEX_VAULTS:-${HOME:-${USERPROFILE}}/Vaults}:/vaults
      - ${CORTEX_CLAUDE_PROJECTS:-${HOME:-${USERPROFILE}}/.claude/projects}:/claude-projects:ro   # memory to import
      - ${CORTEX_PUSH_TOKEN_HOST:-${HOME:-${USERPROFILE}}/.cortex-secrets/push.token}:/run/secrets/push.token:ro   # the sync's GitHub token, kept outside the vaults folder so agents that read the vaults cannot read it
    # Nothing to set up on the host: one high port on 127.0.0.1, plain HTTP, and names under .localhost, which
    # browsers resolve to this machine by themselves: http://cortex.localhost:8790 and http://<agent>.cortex.localhost:8790.
    # compose.lan.yaml adds the local network (HTTPS); compose.trusted.yaml brings back https://cortex.local
    # with its own DNS and a CA trusted on the host (what install.ps1 / install.sh set up).
    ports:
      - "${CORTEX_ADDRESS:-127.0.0.1}:${CORTEX_PORT:-8790}:8443"
    command:
      - --address=${CORTEX_ADDRESS:-127.0.0.1}
      - --domain=${CORTEX_DOMAIN:-cortex.localhost}
      - --host-root=${CORTEX_VAULTS:-${HOME:-${USERPROFILE}}/Vaults}
      - --mcp   # agents at /mcp/<vault>, each behind the token in <vault>/_brain/state/mcp.token
      - --public-port=${CORTEX_PORT:-8790}
      - --local-http
      - --lan-port=9443
      - --lan-redirect-port=9080
      - --lan-dns-port=5354

# Where the vaults live, set by CORTEX_VAULTS in .env (your choice):
#   - a folder on this machine, mapped into the container (the default: ~/Vaults, or any path you set). You can open
#     the notes in Obsidian or an editor, and back them up like any files;
#   - no folder at all: CORTEX_VAULTS=cortex-vaults keeps them in the Docker volume below, inside Docker only. Use the
#     hub's page and ./cortex.sh to see them; --trusted needs a folder (it installs the CA from it).
# Changing your mind is one `docker compose up`: set CORTEX_VAULTS to the new place and CORTEX_VAULTS_FROM to the old one
# (unset, it is this volume); the "vaults" service copies them over when the new place is empty.
# Careful: `docker compose down -v` deletes this volume and every vault in it. `down` alone keeps it.
volumes:
  cortex-vaults: {}
